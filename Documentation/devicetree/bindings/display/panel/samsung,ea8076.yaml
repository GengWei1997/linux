%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,ea8076.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung EA8076 6.39" 1080x2340 MIPI-DSI AMOLED Panel

maintainers:
  - GengWei1997 <gw19970326@gmail.com>

description:
  The Samsung EA8076 is a 6.39 inch 1080x2340 MIPI-DSI AMOLED panel found
  in devices such as the Xiaomi Redmi K20 Pro.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,ea8076

  reg:
    maxItems: 1

  vddio-supply:
    description: I/O source voltage rail

  vcie-supply:
    description: 3.0V source voltage rail

  reset-gpios: true
  port: true

required:
  - compatible
  - reg
  - vddio-supply
  - vcie-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,ea8076";
            reg = <0>;

            vddio-supply = <&vreg_l14a_1p8>;
            vcie-supply = <&disp_vci>;

            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };

...
