%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/qcom,ufs-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Universal Flash Storage (UFS) Controller Common Properties

maintainers:
  - Bjorn Andersson <bjorn.andersson@linaro.org>

properties:
  clocks:
    minItems: 7
    maxItems: 9

  clock-names:
    minItems: 7
    maxItems: 9

  dma-coherent: true

  interconnects:
    minItems: 2
    maxItems: 2

  interconnect-names:
    items:
      - const: ufs-ddr
      - const: cpu-ufs

  iommus:
    minItems: 1
    maxItems: 2

  phys:
    maxItems: 1

  phy-names:
    items:
      - const: ufsphy

  power-domains:
    maxItems: 1

  required-opps:
    maxItems: 1

  resets:
    maxItems: 1

  '#reset-cells':
    const: 1

  reset-names:
    items:
      - const: rst

  reset-gpios:
    maxItems: 1
    description:
      GPIO connected to the RESET pin of the UFS memory device.

  qcom,no-runtime-pm:
    type: boolean
    description: |
      Keep the link, the host clocks and the PHY powered at all times.

      The QMP UFS PHY is calibrated from the HCE-enable path only.  On
      platforms where a runtime power transition powers the PHY down, the
      next hibern8 exit or transfer aborts with a PA fatal error and the
      link never recovers, because the calibration is not part of the
      runtime resume path.  Such boards can disable clock gating, clock
      scaling, runtime autosuspend and the auto-hibernate timer here, so
      the link is never torn down at runtime.  System suspend is not
      affected: it runs a full HCE disable/enable cycle which
      re-initialises the PHY.

allOf:
  - $ref: ufs-common.yaml

additionalProperties: true
