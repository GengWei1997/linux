%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nxp,tfa9874.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP/Goodix TFA9874 (TFA2) Audio Amplifier

maintainers:
  - GengWei1997 <gw19970326@gmail.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: nxp,tfa9874

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    description:
      GPIO connected to the RST pin. The pin is active high, so the device is
      held in reset while it is asserted.

  sound-name-prefix: true

required:
  - compatible
  - reg
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      audio-codec@34 {
        compatible = "nxp,tfa9874";
        reg = <0x34>;
        reset-gpios = <&tlmm 59 GPIO_ACTIVE_HIGH>;
        #sound-dai-cells = <0>;
      };
    };
